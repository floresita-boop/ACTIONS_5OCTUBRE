name: Django Deploy

on:
  push:
    branches:
      - main
      - feature/suma-resta

jobs:
  deploy:
    name: Desplegar Django
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar proyecto Django
        run: |
          python manage.py check

      - name: Recolectar archivos estáticos
        run: |
          python manage.py collectstatic --noinput

      - name: Preparar despliegue
        run: |
          echo "======================================"
          echo "   DESPLIEGUE DJANGO COMPLETADO"
          echo "======================================"
          echo "Rama: ${GITHUB_REF#refs/heads/}"
          echo "Commit: ${GITHUB_SHA:0:7}"
          echo "Proyecto Django verificado correctamente"