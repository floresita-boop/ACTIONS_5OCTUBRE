<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma y Resta - Django</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; }
        input, button { padding: 10px; margin: 10px 5px; font-size: 16px; border-radius: 5px; border: none; }
        button { background: #3b82f6; color: white; cursor: pointer; }
        button:hover { background: #2563eb; }
        #resultado { font-size: 22px; margin-top: 20px; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Calculadora (Suma y Resta)</h2>
        <input type="number" id="num1" placeholder="Número 1"><br>
        <input type="number" id="num2" placeholder="Número 2"><br>

        <button onclick="sumar()">Sumar (+)</button>
        <button onclick="restarButton()">Restar (-)</button>

        <div id="resultado">Resultado: 0</div>
    </div>

    <script>
        function sumar() {
            let n1 = parseFloat(document.getElementById('num1').value) || 0;
            let n2 = parseFloat(document.getElementById('num2').value) || 0;
            let res = n1 + n2;
            document.getElementById('resultado').innerText = "Resultado: " + res;
        }

        function restarButton() {
            let n1 = parseFloat(document.getElementById('num1').value) || 0;
            let n2 = parseFloat(document.getElementById('num2').value) || 0;
            let res = n1 - n2;
            document.getElementById('resultado').innerText = "Resultado: " + res;
        }
    </script>

</body>
</html>
